name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UseKsaReferencePackage: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet nuget add source \
            --username github-actions \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/StarMapLoader/index.json"
          dotnet restore StarMap-ExampleMods.sln

      - name: Build
        run: dotnet build StarMap-ExampleMods.sln --configuration Release --no-restore --warnaserror

      - name: Verify formatting
        run: dotnet format StarMap-ExampleMods.sln --no-restore --verify-no-changes
